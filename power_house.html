<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Power House • Vehicle Connection</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#101318;color:#edf0f5;margin:0}main{max-width:650px;margin:0 auto;padding:40px 20px}h1{font-size:36px;margin:8px 0}h2{font-size:19px}p{color:#b1bac9;line-height:1.5}.tag{color:#a5b4fc;font-size:12px;letter-spacing:2px;font-weight:700}.panel{background:#1b2029;border:1px solid #343b48;border-radius:16px;padding:22px;margin-top:20px}label{display:block;font-size:14px;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #505a6b;border-radius:8px;background:#101318;color:white;font:inherit}button{background:#a5b4fc;color:#111827;width:100%;border:0;border-radius:8px;padding:13px;font:inherit;font-weight:700;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}.check{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #343b48;font-size:14px}.value{text-align:right;overflow-wrap:anywhere}.good{color:#86efac}.warn{color:#fcd34d}.bad{color:#fca5a5}.car{padding:12px 0;border-bottom:1px solid #343b48}.small{font-size:12px}#detail{overflow-wrap:anywhere}footer{font-size:12px;color:#9ca3af;margin-top:20px}
</style><style>pre,code{white-space:pre-wrap;overflow-wrap:anywhere}.check span:first-child{flex:0 0 40%}select{padding:8px;max-width:100%}button{margin-top:12px}fieldset{border:0;padding:0;margin:0}summary{cursor:pointer}</style></head>
<body><main><div class="tag">POWER HOUSE / V0.2</div><h1>Connect your Tesla</h1><p>Europe · Read-only vehicle access</p>
<fieldset id="controls">
<form class="panel" id="credentials" autocomplete="off"><h2>Developer credentials</h2>
<label for="cid">Client ID</label><input id="cid" required spellcheck="false">
<label for="secret">Client Secret</label><input id="secret" type="password" required>
<button>Use credentials for this session</button><button type="button" id="legacy">Run original partner connection test</button>
<p id="legacyResult" aria-live="polite"></p></form>
<details class="panel"><summary>Application registration</summary><label for="domain">Public application domain</label><input id="domain" placeholder="username.github.io">
<label for="existing">Existing OpenSSL public key (public-key.pem)</label><input type="file" id="existing" accept=".pem"><button id="useExisting">Use existing public key</button>
<label for="password">Local private-key passphrase (12+ characters)</label><input id="password" type="password" autocomplete="off">
<button id="key">Generate or open key pair</button><pre id="public"></pre><code id="path"></code>
<button data-op="hosted">Check hosted public key</button><button data-op="partner">Test partner authentication</button>
<button data-op="verify">Verify EU registration</button><button id="register">Register domain with Tesla Europe…</button></details>
<section class="panel"><h2>Personal authorization</h2><label for="redirect">Registered callback</label>
<select id="redirect"><option value="local">Local loopback</option><option value="hosted">Hosted HTTPS callback</option></select>
<button id="signin">Sign in with Tesla</button><button data-op="discover">Discover vehicles</button></section>
<section class="panel" aria-live="polite"><h2>Connection checklist</h2><div id="checks"></div></section>
<section class="panel" id="vehicles" hidden><h2>Authorized vehicles</h2><label for="cars">Vehicle · last reported state · masked VIN</label><select id="cars"></select>
<button data-op="cached">Read cached data</button><button id="live">Read live data</button><div id="snapshot"></div></section></fieldset>
<p id="error" role="alert"></p><footer>Credentials and tokens expire with this local session. Vehicle reads run on request.</footer></main>
<script>
const el = id => document.getElementById(id);
let current;
function row(parent,label,value){
  const div=document.createElement('div'); div.className='check';
  for(const text of [label,value]){
    const span=document.createElement('span'); span.textContent=text; div.append(span);
  }
  div.lastChild.className='value'; parent.append(div);
}
function selection(){
  const car=el('cars').value;
  el('live').disabled=current.cars[car]?.state!=='online';
  const panel=el('snapshot'); panel.replaceChildren();
  const data=current.snapshot;
  if(!data || data.car!==car)return;
  row(panel,'Source',data.cached?'Tesla cache (may be hours old)':'Live vehicle read');
  for(const [block,time] of Object.entries(data.timestamps))row(panel,block,new Date(time).toLocaleString());
  for(const [label,value] of Object.entries(data.values))row(panel,label,value);
}
function render(data){
  if(data.domain && current?.domain!==data.domain)el('redirect').value='hosted';
  current=data; el('checks').replaceChildren();
  for(const [step,status] of Object.entries(data.checks))row(el('checks'),step,status);
  el('public').textContent=data.public;
  el('path').textContent=data.domain?'https://'+data.domain+data.key_path:'';
  const selected=el('cars').value; el('cars').replaceChildren();
  for(const [id,car] of Object.entries(data.cars)){
    el('cars').add(new Option([car.name,car.state,car.vin].join(' · '),id));
  }
  if(data.cars[selected])el('cars').value=selected;
  el('vehicles').hidden=!el('cars').length;
  selection();
}
async function send(op,fields={},path='/action'){
  el('controls').disabled=true; el('error').textContent='';
  try{
    const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Local-Nonce':'__NONCE__'},body:JSON.stringify({op,...fields})});
    if(!response.ok)throw Error('Local request failed (HTTP '+response.status+'). Reload Power House and retry.');
    const data=await response.json();
    if(path==='/test'){
      el('legacyResult').textContent=[data.auth,data.api,data.vehicle,data.detail,...data.cars.map(c=>[c.name,c.state,c.vin].join(' · '))].join(' / ');
    }else{
      render(data);
      if(data.authorize)location.assign(data.authorize);
    }
  }catch(err){el('error').textContent=err.message;}finally{el('controls').disabled=false;}
}
function credentials(){
  const fields={client_id:el('cid').value.trim(),secret:el('secret').value.trim()};
  el('secret').value=''; return fields;
}
el('credentials').onsubmit=e=>{e.preventDefault();send('configure',credentials());};
el('legacy').onclick=()=>{if(el('credentials').reportValidity())send('test',credentials(),'/test');};
el('useExisting').onclick=async()=>{
  const file=el('existing').files[0];
  if(!file || file.size>1024){el('error').textContent='Choose your OpenSSL public-key.pem file.';return;}
  const pem=(await file.text()).trim();
  if(!/^-----BEGIN PUBLIC KEY-----\s+[A-Za-z0-9+/=\s]+-----END PUBLIC KEY-----$/.test(pem)){
    el('error').textContent='Choose the PEM labeled BEGIN PUBLIC KEY.';return;
  }
  send('import_key',{domain:el('domain').value,pem});
};
el('key').onclick=()=>{const password=el('password').value;el('password').value='';send('key',{domain:el('domain').value,password});};
el('register').onclick=()=>{if(current.domain && confirm('Register '+current.domain+' with Tesla Europe? This changes the partner account.'))send('register',{confirm:current.domain});};
el('signin').onclick=()=>send('signin',{hosted:el('redirect').value==='hosted'});
el('cars').onchange=selection;
el('live').onclick=()=>send('live',{car:el('cars').value});
for(const button of document.querySelectorAll('[data-op]'))button.onclick=()=>send(button.dataset.op,{car:el('cars').value});
send('status');
</script></body></html>
